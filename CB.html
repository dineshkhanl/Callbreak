
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Break Auto Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #123528;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #ffd76b;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
  margin: 15px 0;
}

.stat {
  background: #20523e;
  padding: 12px 5px;
  border-radius: 9px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 24px;
  color: #ffd76b;
}

.panel {
  background: #20523e;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
}

.players {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 7px;
}

.player {
  background: #153d2d;
  padding: 12px 4px;
  border-radius: 8px;
  text-align: center;
}

.player strong {
  display: block;
  font-size: 25px;
  color: #8df0aa;
}

.player.active {
  border: 3px solid #ffd76b;
  background: #315d42;
}

.turn {
  text-align: center;
  color: #ffd76b;
  font-size: 20px;
  font-weight: bold;
  margin: 12px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(13,minmax(0,1fr));
  gap: 5px;
}

.card {
  height: 60px;
  min-width: 0;
  background: white;
  color: #111;
  border: 2px solid #ddd;
  border-radius: 7px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.card.red {
  color: #d11d30;
}

.card.played {
  background: #666;
  color: white;
  opacity: .4;
  text-decoration: line-through;
  cursor: not-allowed;
}

.suit-title {
  grid-column: 1 / -1;
  color: #ffd76b;
  font-size: 17px;
  font-weight: bold;
  padding: 8px 0 3px;
  border-bottom: 1px solid #6b9478;
}

.action {
  border: 0;
  border-radius: 8px;
  padding: 13px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.undo {
  background: #eee;
  color: #222;
}

.reset {
  background: #e8a3a3;
  color: #222;
  width: 100%;
}

.history {
  line-height: 2;
  font-size: 14px;
  max-height: 250px;
  overflow-y: auto;
}

@media(max-width:520px) {
  .cards {
    grid-template-columns: repeat(7,minmax(0,1fr));
  }

  .card {
    height: 53px;
  }

  .players {
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<h1>♥ CALL BREAK ♠</h1>

<div class="summary">
  <div class="stat">
    Played
    <strong id="played">0</strong>
  </div>

  <div class="stat">
    Remaining
    <strong id="remaining">52</strong>
  </div>

  <div class="stat">
    Round
    <strong id="round">1</strong>
  </div>
</div>

<div class="panel">
  <h3>Player Status</h3>
  <div class="players" id="players"></div>
  <div class="turn" id="turn">Player 1's Turn</div>
</div>

<div class="panel">
  <h3>All 52 Cards - Tap to Play</h3>
  <div class="cards" id="cards"></div>
</div>

<div class="panel">
  <h3>Played Cards History</h3>
  <div class="history" id="history">
    No cards played yet.
  </div>

  <button class="action undo" id="undoBtn">
    ↶ Undo Last Card
  </button>

  <button class="action reset" id="resetBtn">
    ↻ NEW GAME
  </button>
</div>

</div>

<script>
"use strict";

// FOUR CARD SUITS IN REQUESTED ORDER

const suits = [
  {s:"♥", name:"Hearts", red:true},
  {s:"♣", name:"Clubs", red:false},
  {s:"♦", name:"Diamonds", red:true},
  {s:"♠", name:"Spades", red:false}
];

const ranks = [
  "A","K","Q","J","10","9","8",
  "7","6","5","4","3","2"
];

const names = [
  "Player 1",
  "Player 2",
  "Player 3",
  "Player 4"
];

let deck = [];
let history = [];
let currentPlayer = 0;


// CREATE NEW DECK

function createDeck() {
  deck = [];

  suits.forEach(suit => {
    ranks.forEach(rank => {
      deck.push({
        id: rank + suit.s,
        suit: suit.s,
        suitName: suit.name,
        red: suit.red,
        played: false
      });
    });
  });
}


// START GAME

function setup() {
  history = [];
  currentPlayer = 0;
  createDeck();
  render();
}


// DISPLAY EVERYTHING

function render() {
  const area = document.getElementById("cards");
  area.innerHTML = "";

  // DISPLAY CARDS BY SUIT

  suits.forEach(suit => {

    const title = document.createElement("div");
    title.className = "suit-title";
    title.textContent = suit.s + " " + suit.name;
    area.appendChild(title);

    const suitCards = deck.filter(
      card => card.suit === suit.s
    );

    suitCards.forEach(card => {

      const button = document.createElement("button");

      button.type = "button";
      button.textContent = card.id;

      button.className =
        "card" +
        (card.red ? " red" : "") +
        (card.played ? " played" : "");

      button.disabled = card.played;

      button.addEventListener("click", () => {
        playCard(card.id);
      });

      area.appendChild(button);
    });
  });


  // PLAYER COUNTS

  const counts = [13,13,13,13];

  history.forEach(item => {
    counts[item.player]--;
  });


  // DISPLAY PLAYERS

  const playerArea = document.getElementById("players");
  playerArea.innerHTML = "";

  counts.forEach((count,index) => {

    const div = document.createElement("div");

    div.className =
      "player" +
      (currentPlayer === index && history.length < 52
        ? " active" : "");

    const name = document.createElement("div");
    name.textContent = names[index];

    const number = document.createElement("strong");
    number.textContent = count;

    const label = document.createElement("div");
    label.textContent = "Cards left";

    div.append(name,number,label);
    playerArea.appendChild(div);
  });


  // TURN

  document.getElementById("turn").textContent =
    history.length === 52
      ? "GAME COMPLETE!"
      : names[currentPlayer] + "'s Turn";


  // SUMMARY

  document.getElementById("played").textContent =
    history.length;

  document.getElementById("remaining").textContent =
    52 - history.length;

  document.getElementById("round").textContent =
    history.length === 52
      ? 13
      : Math.floor(history.length / 4) + 1;


  // HISTORY

  const historyArea = document.getElementById("history");
  historyArea.innerHTML = "";

  if (history.length === 0) {
    historyArea.textContent = "No cards played yet.";
  } else {

    history.forEach((item,index) => {

      const line = document.createElement("div");

      line.textContent =
        (index + 1) + ". " +
        names[item.player] +
        " played " + item.card;

      historyArea.appendChild(line);
    });

    historyArea.scrollTop = historyArea.scrollHeight;
  }
}


// PLAY CARD

function playCard(cardId) {

  if (history.length >= 52) return;

  const card = deck.find(item => item.id === cardId);

  if (!card || card.played) return;

  const remaining =
    13 - history.filter(item =>
      item.player === currentPlayer
    ).length;

  if (remaining <= 0) return;

  card.played = true;

  history.push({
    card: card.id,
    player: currentPlayer
  });

  currentPlayer = (currentPlayer + 1) % 4;

  render();
}


// UNDO LAST CARD

function undo() {

  if (history.length === 0) return;

  const last = history.pop();

  const card = deck.find(item =>
    item.id === last.card
  );

  if (card) {
    card.played = false;
  }

  currentPlayer = last.player;

  render();
}


// NEW GAME

function resetGame() {
  history = [];
  currentPlayer = 0;
  createDeck();
  render();
}


// BUTTON EVENTS

document.getElementById("undoBtn")
  .addEventListener("click", undo);

document.getElementById("resetBtn")
  .addEventListener("click", resetGame);


// INITIALISE

setup();

</script>

</body>
</html>
